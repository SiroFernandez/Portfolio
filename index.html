  .top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.5rem 0; flex-wrap: wrap; }

function getInitialLang() {
  try {
    const saved = localStorage.getItem("lang");
    if (saved === "es" || saved === "en") return saved;
  } catch (e) { /* sin almacenamiento disponible */ }
  return (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
}

let currentLang = getInitialLang();
let openIndex = -1;

function renderProjects(t) {
  const ul = document.getElementById("projects");
  ul.innerHTML = "";
  t.projects.forEach((p, i) => {
    const li = document.createElement("li");
    if (i === openIndex) li.classList.add("open");

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "row";
    btn.id = "proj-btn-" + i;
    btn.setAttribute("aria-expanded", i === openIndex ? "true" : "false");
    btn.setAttribute("aria-controls", "proj-panel-" + i);

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = p.name;
    const summary = document.createElement("span");
    summary.className = "summary";
    summary.textContent = p.summary;
    const icon = document.createElement("span");
    icon.className = "icon";
    icon.setAttribute("aria-hidden", "true");
    btn.append(name, summary, icon);

    const panel = document.createElement("div");
    panel.className = "panel";
    panel.id = "proj-panel-" + i;
    panel.setAttribute("role", "region");
    panel.setAttribute("aria-labelledby", btn.id);
    panel.inert = i !== openIndex;

    const clip = document.createElement("div");
    const body = document.createElement("div");
    body.className = "panel-body";

    const kind = document.createElement("p");
    kind.className = "kind";
    kind.textContent = p.kind;
    const detail = document.createElement("p");
    detail.textContent = p.detail;
    body.append(kind, detail);

    if (p.stack && p.stack.length) {
      const tags = document.createElement("ul");
      tags.className = "tags";
      tags.setAttribute("aria-label", t.stackLabel);
      p.stack.forEach(s => {
        const tag = document.createElement("li");
        tag.textContent = s;
        tags.appendChild(tag);
      });
      body.appendChild(tags);
    }

    if (p.links && p.links.length) {
      const links = document.createElement("div");
      links.className = "plinks";
      p.links.forEach(l => {
        const a = document.createElement("a");
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = l.label[currentLang];
        links.appendChild(a);
      });
      body.appendChild(links);
    }

    clip.appendChild(body);
    panel.appendChild(clip);
    li.append(btn, panel);
    ul.appendChild(li);

    btn.addEventListener("click", () => {
      openIndex = (openIndex === i) ? -1 : i;
      renderProjects(I18N[currentLang]);
      document.getElementById("proj-btn-" + i).focus();
    });
  });
}

function renderSkills(t) {

    const dd = document.createElement("dd");
    dd.textContent = items;
    dl.append(dt, dd);
  });
  const langs = document.getElementById("langs");
  langs.innerHTML = "";
  t.langs.forEach(([name, level]) => {
    const li = document.createElement("li");
    li.append(name + " ");
    const span = document.createElement("span");
    span.textContent = level;
    li.appendChild(span);
    langs.appendChild(li);
  });
}

function render() {
  const t = I18N[currentLang];
  document.documentElement.lang = currentLang;
  document.title = t.pageTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t[el.dataset.i18n];
  });
  document.querySelectorAll(".lang button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === currentLang));
  });
  renderProjects(t);
  renderSkills(t);
}

/* Enlaces */
["link-linkedin", "link-linkedin-2"].forEach(id => {
  document.getElementById(id).href = CONFIG.linkedin;
});
if (CONFIG.github) {
  const gh = document.getElementById("link-github");
  gh.href = CONFIG.github;
  gh.hidden = false;
}
const EMAIL = CONFIG.emailUser + "@" + CONFIG.emailDomain;
const emailLink = document.getElementById("email-link");
emailLink.href = "mailto:" + EMAIL;
emailLink.textContent = EMAIL;

let statusTimer;
function showCopied() {
  const status = document.getElementById("copy-status");
  status.textContent = I18N[currentLang].copied;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { status.textContent = ""; }, 3000);
}
document.getElementById("btn-copy").addEventListener("click", () => {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(EMAIL).then(showCopied).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
});
function fallbackCopy() {
  const ta = document.createElement("textarea");
  ta.value = EMAIL;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); showCopied(); } catch (e) { /* el usuario puede copiar el texto a mano */ }
  document.body.removeChild(ta);
}

/* Selector de idioma */
document.querySelectorAll(".lang button").forEach(b => {
  b.addEventListener("click", () => {
    currentLang = b.dataset.lang;
    try { localStorage.setItem("lang", currentLang); } catch (e) { /* ignorar */ }
    render();
  });
});

render();
</script>
</body>
</html>
